<app-modal-layout>
  <form body class="p-fluid" [formGroup]="formulario">
    <div class="flex flex-column gap-2">
      <div class="flex flex-column gap-1">
        <label class="font-medium text-700">
          Tipo de desclassificação
          <span class="text-red-500 ml-1">*</span>
        </label>
        <p-select
          formControlName="tipoDesclassificacao"
          [options]="tipoOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Selecione"
          appendTo="body"
          class="w-full"
        />
        <app-mensagem [control]="formulario.get('tipoDesclassificacao')" />
      </div>

      <div class="flex flex-column gap-1">
        <label class="font-medium text-700">
          Valor desclassificado
          <span class="text-red-500 ml-1">*</span>
        </label>
        <p-inputNumber
          formControlName="valorDesclassificado"
          mode="currency"
          currency="BRL"
          locale="pt-BR"
          [min]="0.01"
          placeholder="R$ 0,00"
          styleClass="w-full"
        />
        <app-mensagem [control]="formulario.get('valorDesclassificado')" [customMessages]="mensagensValor" />
      </div>

      <div class="flex flex-column gap-1">
        <label class="font-medium text-700">
          Motivo
          <span class="text-red-500 ml-1">*</span>
        </label>
        <textarea pTextarea formControlName="motivo" placeholder="Motivo da desclassificação" rows="3" class="w-full" maxlength="1000"></textarea>
        <app-mensagem [control]="formulario.get('motivo')" />
      </div>
    </div>
  </form>

  <span footer></span>
  <span footer class="flex gap-2">
    <p-button label="Cancelar" severity="secondary" variant="outlined" (onClick)="onCancelar()" />
    <p-button
      label="Desclassificar"
      icon="pi pi-exclamation-triangle"
      severity="warn"
      [loading]="salvando()"
      [disabled]="formulario.invalid"
      (onClick)="onDesclassificar()"
    />
  </span>
</app-modal-layout>
