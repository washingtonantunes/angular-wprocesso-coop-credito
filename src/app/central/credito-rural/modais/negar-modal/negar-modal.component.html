<app-modal-layout>
  <form body class="p-fluid" [formGroup]="formulario">
    <div class="flex flex-column gap-1">
      <label class="font-medium text-700">
        Motivo
        <span class="text-red-500 ml-1">*</span>
      </label>
      <textarea pTextarea formControlName="motivo" placeholder="Motivo da negativa" rows="4" class="w-full" maxlength="1000"></textarea>
      <app-mensagem [control]="formulario.get('motivo')" />
    </div>
  </form>

  <span footer></span>
  <span footer class="flex gap-2">
    <p-button label="Cancelar" severity="secondary" variant="outlined" (onClick)="onCancelar()" />
    <p-button label="Negar" icon="pi pi-times" severity="danger" [loading]="salvando()" [disabled]="formulario.invalid" (onClick)="onNegar()" />
  </span>
</app-modal-layout>
