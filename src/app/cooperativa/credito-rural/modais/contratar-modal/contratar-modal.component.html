<app-modal-layout>
  <form body class="p-fluid" [formGroup]="formulario">
    <div class="flex flex-column gap-2">
      <div class="flex flex-column gap-1">
        <label class="font-medium text-700">
          Documento do cooperado (CPF ou CNPJ)
          <span class="text-red-500 ml-1">*</span>
        </label>
        <div class="flex gap-2">
          <input pInputText appDocumentoMask formControlName="documento" placeholder="CPF ou CNPJ" class="w-full" />
          <p-button
            icon="pi pi-search"
            label="Buscar"
            [loading]="buscando()"
            [disabled]="formulario.get('documento')?.invalid"
            (onClick)="onBuscarCooperado()"
          />
        </div>
        <app-mensagem [control]="formulario.get('documento')" />
        @if (cooperado(); as c) {
          <small class="text-green-600">
            <i class="pi pi-check-circle mr-1"></i>
            {{ c.nome }}
          </small>
        }
      </div>

      <div class="flex flex-column gap-1">
        <label class="font-medium text-700">
          Valor
          <span class="text-red-500 ml-1">*</span>
        </label>
        <p-inputNumber formControlName="valor" mode="currency" currency="BRL" locale="pt-BR" [min]="0.01" placeholder="R$ 0,00" styleClass="w-full" />
        <app-mensagem [control]="formulario.get('valor')" />
      </div>

      <div class="flex flex-column gap-1">
        <label class="font-medium text-700">
          Finalidade
          <span class="text-red-500 ml-1">*</span>
        </label>
        <textarea pTextarea formControlName="finalidade" placeholder="Finalidade rural do crédito" rows="3" class="w-full" maxlength="1000"></textarea>
        <app-mensagem [control]="formulario.get('finalidade')" />
      </div>
    </div>
  </form>

  <span footer></span>
  <span footer class="flex gap-2">
    <p-button label="Cancelar" severity="secondary" variant="outlined" (onClick)="onCancelar()" />
    <p-button label="Contratar" icon="pi pi-check" [loading]="salvando()" [disabled]="!cooperado() || formulario.invalid" (onClick)="onSalvar()" />
  </span>
</app-modal-layout>
